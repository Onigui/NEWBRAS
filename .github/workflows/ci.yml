name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formato, lint, tipos, testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build para o GitHub Pages
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: apps/web/dist

  deploy:
    name: Publicar no GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  tags:
    name: Marcar fases concluídas
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Criar as tags que faltam (docs/tags-das-fases.txt)
        run: |
          while read -r tag sha; do
            case "$tag" in ''|'#'*) continue ;; esac
            if ! git cat-file -e "$sha^{commit}" 2> /dev/null; then
              echo "::warning::$tag: commit $sha não encontrado"
            elif git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "$tag já existe"
            else
              git tag "$tag" "$sha"
              git push origin "refs/tags/$tag"
              echo "$tag criada em $sha"
            fi
          done < docs/tags-das-fases.txt
